# XcodeGen project definition. Optional convenience: run `xcodegen generate`
# in this folder to produce EchoMeal.xcodeproj. If you prefer, the README
# also has manual steps to create the project in Xcode by hand.
name: EchoMeal
options:
  bundleIdPrefix: com.echochambermedia
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

configFiles:
  Debug: Secrets.xcconfig
  Release: Secrets.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.10"
    TARGETED_DEVICE_FAMILY: "1"
    GENERATE_INFOPLIST_FILE: false
    CODE_SIGN_STYLE: Automatic
    # DEVELOPMENT_TEAM comes from Secrets.xcconfig

# Spelled out rather than left to Xcode's autocreated scheme, because the Run
# action needs the local StoreKit configuration. Without it the paywall in a
# simulator finds no products and cannot be tested. The file is local only:
# it never ships in the bundle (it sits outside the sources path) and has no
# effect on TestFlight or App Store builds, which use the real products from
# App Store Connect. Every other action keeps Xcode's default config, so
# `-scheme EchoMeal ... archive` still archives Release.
schemes:
  EchoMeal:
    build:
      targets:
        EchoMeal: all
    run:
      config: Debug
      storeKitConfiguration: MealTime.storekit
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

targets:
  EchoMeal:
    type: application
    platform: iOS
    sources:
      # Exclude Finder detritus: this repo lives on an iCloud-synced Desktop,
      # which reintroduces .DS_Store and trips codesign ("resource fork, Finder
      # information, or similar detritus not allowed").
      - path: EchoMeal
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.echochambermedia.echomeal
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # iPhone only. Must be set on the target: the project-level value is
        # overridden by XcodeGen's per-target default of "1,2", which pulls in
        # iPad and makes App Store validation demand all four orientations for
        # iPad multitasking (upload error 90474) even though this app is portrait.
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: EchoMeal/Info.plist
      configs:
        # aps-environment must be `development` locally and `production` for
        # TestFlight/App Store uploads, so the entitlements file differs per config.
        Debug:
          CODE_SIGN_ENTITLEMENTS: EchoMeal/EchoMeal.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: EchoMeal/EchoMeal.Release.entitlements
