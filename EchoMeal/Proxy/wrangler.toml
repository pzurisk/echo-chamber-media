name = "mealtime-proxy"
main = "worker.js"
compatibility_date = "2026-01-01"

# Global daily ceiling across every subscriber combined. This is a circuit
# breaker against a runaway bill, not a per-user budget, so it sits far above
# what normal use produces. The per-subscription cap below is what an individual
# household actually feels. Raise this number and redeploy to loosen it.
# Both are plain variables, not secrets, so they are safe to read in the dashboard.
#
# Sized for the real subscriber count, not an imagined one. At two phones plus a
# handful of TestFlight testers, 60 is roughly ten times normal use and caps a
# runaway day at about five dollars. The previous value of 400 was around $36 a
# day at typical cost and $115 at the worst case the token ceiling allows, which
# is a circuit breaker for a business that does not exist yet. Raise it when the
# subscriber count justifies it.
#
# This matters more than it looks: both quota checks in worker.js are skipped
# entirely if the KV read fails, so during a Cloudflare outage this cap is not
# enforced either. The only limit that always holds is the monthly spend cap set
# on the Anthropic account itself. Keep that one set.
[vars]
DAILY_REQUEST_CAP = "60"

# TEMPORARY (2026-08-21): no build on any phone sends x-txn-id yet, the
# subscription code landed in git after the last archived build (see
# EchoMeal.md in the vault). Set to "0" to skip the subscription gate
# entirely so plans can generate while a build with the subscription flow
# gets made and installed. Set back to "1", or delete this line, once that
# build is on the phone and tested end to end.
REQUIRE_SUBSCRIPTION = "0"

# One subscription's included meal plans per calendar month. This number is
# quoted on the paywall, in the App Store description, and in the refusal message
# the app shows at the cap. Changing it here means changing it in all three.
MONTHLY_GENERATION_CAP = "20"

# Whether TestFlight and sandbox subscriptions count as real ones. Leave this
# on while testing a build through TestFlight, because TestFlight purchases live
# in Apple's sandbox and production lookups return 404 for them. Set it to "0"
# to accept only real paid subscriptions.
#
# Leaving it on is a small, bounded risk rather than a hole: a sandbox
# transaction for this app requires either a TestFlight invite or a sandbox
# tester account, and both of those only exist if Billy created them.
ALLOW_SANDBOX_SUBSCRIPTIONS = "1"

# Counter storage. Holds three kinds of value and nothing else: a count for the
# day, a count for one subscription in one month, and a short-lived yes or no on
# whether a transaction ID is a live subscription. Those keys include the
# subscription's Apple transaction ID, which is a purchase identifier and is
# declared as such in App Privacy. No name, no email, no IP address, no request
# bodies, no meal plans.
[[kv_namespaces]]
binding = "SPEND_COUNTER"
id = "a4dabf9897e841f88327a8ef1c9cc49f"

# Per-caller burst limit. The worker hashes the caller's IP into a short
# fingerprint and passes only that to this limiter, which keeps it in memory at
# the edge. No IP, raw or hashed, is ever written to storage.
# "period" only accepts 10 or 60. namespace_id is a per-worker label.
[[ratelimits]]
name = "BURST_LIMITER"
namespace_id = "1001"
simple = { limit = 6, period = 60 }
