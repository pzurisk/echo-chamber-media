# XcodeGen project definition. Run `xcodegen generate` in this folder to
# produce SignalChainTeacher.xcodeproj. See README.md for manual setup if
# you prefer not to install XcodeGen.
name: SignalChainTeacher
options:
  bundleIdPrefix: com.echochambermedia
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    GENERATE_INFOPLIST_FILE: true
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic

targets:
  SignalChainTeacher:
    type: application
    platform: macOS
    sources:
      - path: SignalChainTeacher
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.echochambermedia.signalchainteacher
        PRODUCT_NAME: Signal Chain Teacher
        INFOPLIST_KEY_CFBundleDisplayName: Signal Chain Teacher
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        ENABLE_HARDENED_RUNTIME: true
        CODE_SIGN_ENTITLEMENTS: SignalChainTeacher/SignalChainTeacher.entitlements
